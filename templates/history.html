<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IBVAP — Incident History</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e13;
    --panel: #10161d;
    --panel-raised: #151d26;
    --grid-line: #1d2731;
    --text-primary: #dce4ea;
    --text-muted: #5f7080;
    --text-dim: #3d4a57;
    --accent: #35d68a;
    --accent-dim: #1d6e49;
    --critical: #ff3b3b;
    --high: #ff9d2e;
    --medium: #ffd23f;
    --low: #5f7080;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
    background-attachment: fixed;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--grid-line);
    background: linear-gradient(180deg, rgba(16,22,29,0.95), rgba(16,22,29,0.75));
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-text .title { font-family: var(--font-mono); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; }
  .brand-text .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  header a.back-link {
    font-family: var(--font-mono); font-size: 12px; color: var(--accent);
    text-decoration: none; border: 1px solid var(--accent-dim); padding: 7px 14px;
    border-radius: 4px; letter-spacing: 0.04em;
  }
  header a.back-link:hover { background: var(--accent-dim); }

  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--grid-line); border-radius: 6px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .filters select, .filters input {
    background: var(--panel-raised); border: 1px solid var(--grid-line); color: var(--text-primary);
    font-family: var(--font-mono); font-size: 12px; padding: 7px 10px; border-radius: 4px;
  }
  .filters button {
    background: var(--accent-dim); border: 1px solid var(--accent); color: var(--text-primary);
    font-family: var(--font-mono); font-size: 12px; padding: 7px 14px; border-radius: 4px; cursor: pointer;
  }
  .filters button:hover { background: var(--accent); color: #04140c; }
  .filters .count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--grid-line); border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card .thumb-wrap { width: 100%; aspect-ratio: 16/9; background: #060a0e; }
  .card .thumb {
    width: 100%; aspect-ratio: 16/9; background: #060a0e; object-fit: cover; display: block;
  }
  .card .thumb.placeholder {
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-family: var(--font-mono); font-size: 11px;
  }
  .card .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .card .top-row { display: flex; justify-content: space-between; align-items: center; }
  .badge {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
    padding: 3px 8px; border-radius: 3px; text-transform: uppercase;
  }
  .badge.CRITICAL { background: rgba(255,59,59,0.15); color: var(--critical); border: 1px solid var(--critical); }
  .badge.HIGH { background: rgba(255,157,46,0.15); color: var(--high); border: 1px solid var(--high); }
  .badge.MEDIUM { background: rgba(255,210,63,0.15); color: var(--medium); border: 1px solid var(--medium); }
  .badge.LOW { background: rgba(95,112,128,0.15); color: var(--low); border: 1px solid var(--low); }
  .card .time { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .card .desc { font-size: 13px; color: var(--text-primary); line-height: 1.4; }
  .card .cam { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-family: var(--font-mono); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-text">
      <div class="title">IBVAP — INCIDENT HISTORY</div>
      <div class="subtitle">Persistent event log &amp; snapshot review</div>
    </div>
  </div>
  <a class="back-link" href="/">&larr; Back to Live Dashboard</a>
  <a class="back-link" href="/analytics" style="margin-left:10px;">Analytics</a>
  <a class="back-link" href="/upload" style="margin-left:10px;">Upload Video</a>
  <a class="back-link" href="/ledger" style="margin-left:10px;">Evidence Ledger</a>
  <a class="back-link" href="/logout" style="margin-left:10px;">Logout</a>
</header>

<main>
  <div class="filters">
    <select id="f-type">
      <option value="">All event types</option>
      <option value="known_person_seen">Known person seen</option>
      <option value="weapon_detected">Weapon detected</option>
      <option value="person_detected">Person detected</option>
      <option value="vehicle_detected">Vehicle detected</option>
      <option value="intrusion">Zone intrusion</option>
      <option value="crawling">Crawling</option>
      <option value="climbing">Climbing</option>
      <option value="face_detected">Face detected</option>
      <option value="vehicle_plate_read">Plate read</option>
      <option value="night_intrusion">Night intrusion</option>
      <option value="night_motion">Night motion</option>
    </select>
    <select id="f-severity">
      <option value="">All severities</option>
      <option value="CRITICAL">Critical</option>
      <option value="HIGH">High</option>
      <option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option>
    </select>
    <select id="f-min-score">
      <option value="">Any threat score</option>
      <option value="80">80+ (Severe)</option>
      <option value="60">60+ (Elevated)</option>
      <option value="35">35+ (Moderate)</option>
    </select>
    <button id="refresh-btn">Refresh</button>
    <button id="export-json-btn">Export JSON</button>
    <button id="export-csv-btn">Export CSV</button>
    <span class="count" id="result-count"></span>
  </div>

  <div class="filters" id="webhooks-panel" style="flex-direction: column; align-items: stretch; gap: 8px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <strong style="font-family: var(--font-mono); font-size: 12px; color: var(--text-muted);">C2 / WEBHOOK INTEGRATIONS</strong>
      <span style="font-size: 11px; color: var(--text-dim);">— every alert is POSTed as JSON to each URL below in real time</span>
    </div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="webhook-url-input" placeholder="https://your-c2-system.example.com/ingest" style="flex:1;">
      <button id="webhook-add-btn">Add Webhook</button>
    </div>
    <div id="webhooks-list" style="display:flex; flex-direction:column; gap:6px;"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty-msg" style="display:none;">No incidents match these filters.</div>
</main>

<script>
  const grid = document.getElementById('grid');
  const emptyMsg = document.getElementById('empty-msg');
  const resultCount = document.getElementById('result-count');

  const SEVERITY_ORDER = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };

  function labelFor(type) {
    return type.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function fmtDateTime(date, time) {
    return `${date}  ${time}`;
  }

  function scoreColor(score) {
    if (score >= 80) return '#ff3b3b';
    if (score >= 60) return '#ff9d2e';
    if (score >= 35) return '#ffd23f';
    return '#5f7080';
  }

  function renderEvents(events) {
    grid.innerHTML = '';
    resultCount.textContent = `${events.length} incident${events.length === 1 ? '' : 's'}`;
    if (events.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    for (const ev of events) {
      const card = document.createElement('div');
      card.className = 'card';

      const thumbHtml = ev.snapshot_url
        ? `<img class="thumb" src="${ev.snapshot_url}" loading="lazy" alt="snapshot">`
        : `<div class="thumb placeholder">NO SNAPSHOT</div>`;

      const score = ev.threat_score ?? 0;
      const scoreBadge = `<span title="Threat score" style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:${scoreColor(score)};border:1px solid ${scoreColor(score)};border-radius:3px;padding:1px 7px;">${score}</span>`;

      const clipBtnHtml = ev.clip_url
        ? `<button class="clip-toggle-btn" data-clip="${ev.clip_url}" style="font-family:var(--font-mono);font-size:10px;color:var(--accent);background:transparent;border:1px solid var(--accent-dim);border-radius:3px;padding:2px 8px;cursor:pointer;">▶ View clip</button>`
        : '';

      card.innerHTML = `
        <div class="thumb-wrap">${thumbHtml}</div>
        <div class="body">
          <div class="top-row">
            <span style="display:flex;align-items:center;gap:6px;">
              <span class="badge ${ev.severity}">${ev.severity}</span>
              ${scoreBadge}
            </span>
            <span class="time">${fmtDateTime(ev.date, ev.time)}</span>
          </div>
          <div class="desc">${ev.description}</div>
          <div class="cam" style="display:flex;justify-content:space-between;align-items:center;">
            <span>Camera: ${ev.camera_id} · ${labelFor(ev.event_type)}</span>
            ${clipBtnHtml}
          </div>
        </div>
      `;
      grid.appendChild(card);

      const clipBtn = card.querySelector('.clip-toggle-btn');
      if (clipBtn) {
        clipBtn.addEventListener('click', () => {
          const thumbWrap = card.querySelector('.thumb-wrap');
          if (thumbWrap.querySelector('video')) return; // already playing
          thumbWrap.innerHTML = `<video class="thumb" src="${clipBtn.dataset.clip}" controls autoplay loop></video>`;
        });
      }
    }
  }

  async function loadEvents() {
    const type = document.getElementById('f-type').value;
    const severity = document.getElementById('f-severity').value;
    const minScore = document.getElementById('f-min-score').value;
    const params = new URLSearchParams({ limit: '150' });
    if (type) params.set('event_type', type);
    if (severity) params.set('severity', severity);
    if (minScore) params.set('min_score', minScore);

    try {
      const res = await fetch(`/api/events?${params.toString()}`);
      const events = await res.json();
      renderEvents(events);
    } catch (e) {
      grid.innerHTML = '';
      emptyMsg.textContent = 'Failed to load incident history.';
      emptyMsg.style.display = 'block';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', loadEvents);
  document.getElementById('f-type').addEventListener('change', loadEvents);
  document.getElementById('f-severity').addEventListener('change', loadEvents);
  document.getElementById('f-min-score').addEventListener('change', loadEvents);

  function currentFilterParams() {
    const type = document.getElementById('f-type').value;
    const severity = document.getElementById('f-severity').value;
    const minScore = document.getElementById('f-min-score').value;
    const params = new URLSearchParams({ limit: '1000' });
    if (type) params.set('event_type', type);
    if (severity) params.set('severity', severity);
    if (minScore) params.set('min_score', minScore);
    return params;
  }

  document.getElementById('export-json-btn').addEventListener('click', () => {
    const params = currentFilterParams();
    params.set('format', 'json');
    window.location.href = `/api/events/export?${params.toString()}`;
  });
  document.getElementById('export-csv-btn').addEventListener('click', () => {
    const params = currentFilterParams();
    params.set('format', 'csv');
    window.location.href = `/api/events/export?${params.toString()}`;
  });

  // ---- Webhook / C2 integration management ----
  const webhooksList = document.getElementById('webhooks-list');

  function renderWebhooks(hooks) {
    webhooksList.innerHTML = '';
    if (hooks.length === 0) {
      webhooksList.innerHTML = '<div style="font-size:12px;color:var(--text-dim);font-family:var(--font-mono);">No webhooks registered yet.</div>';
      return;
    }
    for (const w of hooks) {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12px;color:var(--text-primary);background:var(--panel-raised);padding:6px 10px;border-radius:4px;';
      row.innerHTML = `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${w.url}</span>`;
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Remove';
      delBtn.style.cssText = 'background:transparent;border:1px solid var(--critical);color:var(--critical);font-family:var(--font-mono);font-size:11px;padding:4px 10px;border-radius:3px;cursor:pointer;';
      delBtn.addEventListener('click', async () => {
        await fetch(`/api/webhooks/${w.id}`, { method: 'DELETE' });
        loadWebhooks();
      });
      row.appendChild(delBtn);
      webhooksList.appendChild(row);
    }
  }

  async function loadWebhooks() {
    try {
      const res = await fetch('/api/webhooks');
      renderWebhooks(await res.json());
    } catch (e) { /* ignore */ }
  }

  document.getElementById('webhook-add-btn').addEventListener('click', async () => {
    const input = document.getElementById('webhook-url-input');
    const url = input.value.trim();
    if (!url) return;
    const res = await fetch('/api/webhooks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    if (res.ok) {
      input.value = '';
      loadWebhooks();
    } else {
      const err = await res.json().catch(() => ({}));
      alert(err.error || 'Failed to add webhook');
    }
  });

  loadWebhooks();
  loadEvents();
</script>
</body>
</html>
