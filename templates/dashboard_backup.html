<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IBVAP — Intelligent Border Video Analytics Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root {
    --bg: #0a0e13;
    --panel: #10161d;
    --panel-raised: #151d26;
    --grid-line: #1d2731;
    --text-primary: #dce4ea;
    --text-muted: #5f7080;
    --text-dim: #3d4a57;
    --accent: #35d68a;          /* tracking/system-nominal green */
    --accent-dim: #1d6e49;
    --critical: #ff3b3b;
    --high: #ff9d2e;
    --medium: #ffd23f;
    --low: #5f7080;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100vh;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
    background-attachment: fixed;
  }

  /* ---------- Top bar ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--grid-line);
    background: linear-gradient(180deg, rgba(16,22,29,0.95), rgba(16,22,29,0.75));
    backdrop-filter: blur(6px);
  }

  .brand { display: flex; align-items: center; gap: 12px; }

  .brand-mark {
    width: 34px; height: 34px;
    border: 1.5px solid var(--accent);
    border-radius: 3px;
    position: relative;
    display: grid; place-items: center;
  }
  .brand-mark::before {
    content: "";
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px 2px var(--accent);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  .brand-text .title {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--text-primary);
  }
  .brand-text .subtitle {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin-top: 1px;
  }

  .status-strip { display: flex; align-items: center; gap: 22px; font-family: var(--font-mono); font-size: 12px; }
  .status-item { display: flex; align-items: center; gap: 7px; color: var(--text-muted); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .status-value { color: var(--text-primary); font-weight: 600; }

  #clock { color: var(--text-primary); font-weight: 600; min-width: 90px; text-align: right; }

  /* ---------- Layout ---------- */
  main {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 18px;
    padding: 18px 24px 24px;
    align-items: start;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--grid-line);
    border-radius: 4px;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--grid-line);
    background: var(--panel-raised);
  }
  .panel-header h2 {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .live-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--critical);
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .live-tag::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--critical);
    border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
  }

  /* ---------- Video panel ---------- */
  .video-wrap {
    position: relative;
    background: #000;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .video-wrap::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background:
      linear-gradient(transparent 96%, rgba(53,214,138,0.06) 100%);
    background-size: 100% 4px;
  }

  .scan-corner { position: absolute; width: 18px; height: 18px; border-color: var(--accent); opacity: 0.7; }
  .scan-corner.tl { top: 10px; left: 10px; border-top: 2px solid; border-left: 2px solid; }
  .scan-corner.tr { top: 10px; right: 10px; border-top: 2px solid; border-right: 2px solid; }
  .scan-corner.bl { bottom: 10px; left: 10px; border-bottom: 2px solid; border-left: 2px solid; }
  .scan-corner.br { bottom: 10px; right: 10px; border-bottom: 2px solid; border-right: 2px solid; }

  .telemetry-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--grid-line);
  }
  .telemetry-item {
    padding: 10px 16px;
    border-right: 1px solid var(--grid-line);
    font-family: var(--font-mono);
  }
  .telemetry-item:last-child { border-right: none; }
  .telemetry-item .label { font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .telemetry-item .value { font-size: 18px; font-weight: 600; color: var(--accent); margin-top: 3px; }

  /* ---------- Alert panel ---------- */
  .alert-panel { display: flex; flex-direction: column; max-height: calc(100vh - 130px); }
  .alert-list { overflow-y: auto; flex: 1; }
  .alert-list::-webkit-scrollbar { width: 6px; }
  .alert-list::-webkit-scrollbar-thumb { background: var(--grid-line); border-radius: 3px; }

  .alert-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--grid-line);
    display: flex;
    gap: 10px;
    animation: slideIn 0.35s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .severity-bar { width: 3px; border-radius: 2px; flex-shrink: 0; }
  .severity-bar.CRITICAL { background: var(--critical); box-shadow: 0 0 6px var(--critical); }
  .severity-bar.HIGH { background: var(--high); }
  .severity-bar.MEDIUM { background: var(--medium); }
  .severity-bar.LOW { background: var(--low); }

  .alert-body { flex: 1; min-width: 0; }
  .alert-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .alert-type {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .alert-type.CRITICAL { color: var(--critical); }
  .alert-type.HIGH { color: var(--high); }
  .alert-type.MEDIUM { color: var(--medium); }
  .alert-type.LOW { color: var(--text-muted); }

  .alert-time { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .alert-detail { font-size: 12px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
  .alert-detail b { color: var(--text-primary); font-weight: 500; }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .alert-count-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--bg);
    background: var(--accent);
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <div class="title">IBVAP</div>
      <div class="subtitle">Intelligent Border Video Analytics Platform</div>
    </div>
  </div>
  <div class="status-strip">
    <div class="status-item">CAMERA <span class="status-value">BOP-01</span></div>
    <div class="status-item"><span class="status-dot"></span> SYSTEM NOMINAL</div>
    <div id="clock">--:--:--</div>
  </div>
</header>

<main>
  <div class="panel">
    <div class="panel-header">
      <h2>Live Feed — Restricted Border Zone</h2>
      <div class="live-tag">LIVE</div>
    </div>
    <div class="video-wrap">
      <img src="/video_feed" alt="live camera feed">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
    </div>
    <div class="telemetry-bar">
      <div class="telemetry-item"><div class="label">FPS</div><div class="value" id="stat-fps">—</div></div>
      <div class="telemetry-item"><div class="label">Active Tracks</div><div class="value" id="stat-tracks">—</div></div>
      <div class="telemetry-item"><div class="label">Frames Processed</div><div class="value" id="stat-frames">—</div></div>
      <div class="telemetry-item"><div class="label">Alerts Today</div><div class="value" id="stat-alerts">0</div></div>
    </div>
  </div>

  <div class="panel alert-panel">
    <div class="panel-header">
      <div style="display:flex;align-items:center;gap:10px"><h2>Real-Time Alerts</h2><button id="sound-btn" type="button" style="font:600 10px var(--font-mono);letter-spacing:.05em;background:transparent;color:var(--accent);border:1px solid var(--accent-dim);border-radius:3px;padding:4px 7px;cursor:pointer">🔊 ENABLE SOUND</button></div>
      <span class="alert-count-badge" id="alert-count">0</span>
    </div>
    <div class="alert-list" id="alert-list">
      <div class="empty-state" id="empty-state">NO ALERTS — MONITORING ACTIVE</div>
    </div>
  </div>
</main>

<script>
  const socket = io();
  const alertList = document.getElementById('alert-list');
  const emptyState = document.getElementById('empty-state');
  const alertCountBadge = document.getElementById('alert-count');
  const soundBtn = document.getElementById('sound-btn');
  let totalAlerts = 0;
  let soundEnabled = false;
  let audioCtx = null;

  function enableAlertSound() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      soundEnabled = true;
      soundBtn.textContent = '🔊 SOUND ON';
      soundBtn.style.background = 'var(--accent-dim)';
      playAlertTone('LOW');
    } catch (e) {
      console.warn('Alert sound unavailable', e);
    }
  }

  function playAlertTone(severity) {
    if (!soundEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = severity === 'CRITICAL' ? 'square' : 'sine';
    osc.frequency.value = severity === 'CRITICAL' ? 880 : severity === 'HIGH' ? 660 : 520;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(severity === 'CRITICAL' ? 0.16 : 0.10, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.25);
  }

  soundBtn.addEventListener('click', enableAlertSound);

  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('en-US', { hour12: false });
  }

  function labelFor(type) {
    const map = {
      'person_detected': 'PERSON DETECTED',
      'gun_detected': 'WEAPON DETECTED',
      'weapon_detected': 'WEAPON DETECTED',
      'intrusion': 'ZONE INTRUSION',
      'crawling': 'SUSPICIOUS: CRAWLING',
      'climbing': 'SUSPICIOUS: CLIMBING',
      'sudden_approach': 'SUSPICIOUS: FAST APPROACH',
      'erratic_movement': 'SUSPICIOUS: ERRATIC MOVEMENT',
      'loitering': 'LOITERING DETECTED',
      'unrecognized_face': 'UNRECOGNIZED FACE',
      'face_detected': 'FACE DETECTED',
      'vehicle_plate_read': 'PLATE READ',
      'unrecognized_vehicle': 'UNRECOGNIZED VEHICLE',
      'night_motion': 'NIGHT MOVEMENT (UNCONFIRMED)',
      'night_intrusion': 'NIGHT INTRUSION (CONFIRMED)'
    };
    return map[type] || type.toUpperCase();
  }

  function renderAlert(alert, prepend = true) {
    if (emptyState) emptyState.remove();

    const item = document.createElement('div');
    item.className = 'alert-item';

    const d = alert.details || {};
    let detailText = '';
    if (d.class_name) detailText += `Object: <b>${d.class_name}</b>`;
    if (d.track_id !== undefined && d.track_id !== null) detailText += ` · Track #<b>${d.track_id}</b>`;
    if (d.zone) detailText += ` · Zone: <b>${d.zone}</b>`;
    if (d.confidence) detailText += ` · Conf: <b>${(d.confidence * 100).toFixed(0)}%</b>`;
    if (d.extra) detailText += ` · Duration: <b>${d.extra}s</b>`;
    if (d.speed_px_per_sec) detailText += ` · Speed: <b>${d.speed_px_per_sec}px/s</b>`;
    if (d.plate_text) detailText += ` · Plate: <b>${d.plate_text}</b>`;

    item.innerHTML = `
      <div class="severity-bar ${alert.severity}"></div>
      <div class="alert-body">
        <div class="alert-top-row">
          <span class="alert-type ${alert.severity}">${labelFor(alert.event_type)}</span>
          <span class="alert-time">${fmtTime(alert.timestamp)}</span>
        </div>
        <div class="alert-detail">${detailText || 'Camera: ' + alert.camera_id}</div>
      </div>
    `;

    if (prepend) {
      alertList.insertBefore(item, alertList.firstChild);
    } else {
      alertList.appendChild(item);
    }

    totalAlerts++;
    alertCountBadge.textContent = totalAlerts;
    document.getElementById('stat-alerts').textContent = totalAlerts;

    playAlertTone(alert.severity);
  }

  socket.on('new_alert', (alert) => renderAlert(alert, true));

  socket.on('alert_backlog', (alerts) => {
    // Sent on connect so a newly-logged-in admin sees history immediately.
    alerts.slice().reverse().forEach(a => renderAlert(a, false));
  });

  // Load alerts directly from backend
  let shownAlertIds = new Set();

  async function loadAlerts() {
    try {
      const response = await fetch('/api/alerts');
      const alerts = await response.json();

      alerts.forEach(alert => {
        if (!shownAlertIds.has(alert.id)) {
          shownAlertIds.add(alert.id);
          renderAlert(alert, true);
        }
      });
    } catch (error) {
      console.log("Alert loading error:", error);
    }
  }

  loadAlerts();
  setInterval(loadAlerts, 1000);

  // Poll lightweight stats
  setInterval(() => {
    fetch('/api/stats').then(r => r.json()).then(s => {
      document.getElementById('stat-fps').textContent = s.fps ?? '—';
      document.getElementById('stat-tracks').textContent = s.active_tracks ?? '—';
      document.getElementById('stat-frames').textContent = s.frame_count ?? '—';
    }).catch(() => {});
  }, 1500);

  function tickClock() {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
  }
  tickClock();
  setInterval(tickClock, 1000);
</script>

</body>
</html>
